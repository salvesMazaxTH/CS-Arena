<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Manager — Champions Showdown Arena</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/ui.css" />
    <link rel="stylesheet" href="./styles/teamCard.css" />
    <link rel="stylesheet" href="./styles/teamsManager.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="tm-body">
    <header class="tm-header">
      <div class="tm-header-brand">
        <a class="tm-back-link" href="/" title="Back to the arena">
          <i class="bx bx-chevron-left"></i> Arena
        </a>
        <h1>Team Manager</h1>
      </div>
      <button type="button" id="tm-new-team" class="tm-primary-btn">
        <i class="bx bx-plus"></i> New team
      </button>
    </header>

    <main class="tm-main">
      <section id="tm-list-view">
        <div class="tm-section-head">
          <h2>Prebuilt</h2>
          <p>Starter line-ups from the base game. Duplicate one to make it yours.</p>
        </div>
        <div id="tm-prebuilt-grid" class="tm-team-grid"></div>

        <div class="tm-section-head">
          <h2>My teams</h2>
          <p>Saved to this browser only.</p>
        </div>
        <div id="tm-custom-grid" class="tm-team-grid"></div>
        <p id="tm-custom-empty" class="tm-empty-note" hidden>
          No custom teams yet. Create one, or duplicate a prebuilt.
        </p>
      </section>

      <section id="tm-builder-view" hidden></section>
    </main>

    <div id="tm-toast" class="tm-toast" role="status" hidden></div>

    <script type="module" src="/js/teamsManager.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
    <script>
      if (
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1"
      ) {
        document.write(
          '<script src="http://localhost:35729/livereload.js?snipver=1"><\/script>',
        );
      }
    </script>
  </body>
</html>
